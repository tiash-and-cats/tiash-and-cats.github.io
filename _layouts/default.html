<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en-US' }}">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    {% seo %}
    <link rel="stylesheet" href="{{ "/assets/css/style.css?v=" | append: site.github.build_revision | relative_url }}">
    <link rel="alternate" type="application/rss+xml" href="/feed.xml" />
    <style>
      .content h1:first-child { display: none; }
    </style>
    <script>
      {% include fbcount.js %}
    </script>
    {% include head-custom.html %}
  </head>
  <body>
    <div class="container-lg px-3 my-5 markdown-body">
      <!-- custom default layout structure -->
      <article>
        <header style="margin-bottom: 2rem; border-bottom: 1px solid #e1e4e8; padding-bottom: 1rem;">
          {% include linktree.html %}
        </header>
        <h1>{{ page.title }}</h1>
        
        {% if page.date or page.tags %}
          <p>
            <blockquote>
              {% if page.date %}
                <em><time datetime="{{ page.date | date_to_xmlschema }}">
                  Published on {{ page.date | date: "%B %d, %Y" }}
                </time></em>
              {% endif %}
              {% if page.tags %}
                <br><em>Tags: {{ page.tags | join: ", " }}</em>
              {% endif %}
            </blockquote>
          </p>
        {% endif %}

        <div class="content">
          {{ content }}
        </div>
      </article>
      <!-- end of custom structure -->
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/anchor-js/5.0.0/anchor.min.js" integrity="sha512-byAcNWVEzFfu+tZItctr+WIMUJvpzT2kokkqcBq+VsrM3OrC5Aj9E2gh+hHpU0XNA3wDmX4sDbV5/nkhvTrj4w==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script>anchors.add();</script>
  </body>
</html>
