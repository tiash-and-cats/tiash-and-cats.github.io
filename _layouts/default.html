<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en-US' }}">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="generator" content="Jekyll v3.10.0" />
    <meta property="og:title" content="Tiash's website!" />
    <meta property="og:locale" content="en_US" />
    <meta name="description" content="Tiash's website!" />
    <meta property="og:description" content="Tiash's website!" />
    <link rel="canonical" href="https://tiash.is-cool.dev/" />
    <meta property="og:url" content="https://tiash.is-cool.dev//" />
    <meta property="og:site_name" content="Tiash&#39;s website!" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />
    <meta property="twitter:title" content="Tiash&#39;s website!" />
    <script type="application/ld+json">
{"@context":"https://schema.org","@type":"WebSite","description":"My website!","headline":"Tiash&#39;s website!","name":"Tiash&#39;s website!","url":"http://tiash-and-cats.github.io/"}</script>
    <link rel="stylesheet" href="{{ "/assets/css/style.css?v=" | append: site.github.build_revision | relative_url }}">
    <link rel="alternate" type="application/rss+xml" href="/feed.xml" />
    <style>
      .content h1:first-child { display: none; }
    </style>
    {% include head-custom.html %}
  </head>
  <body>
    <div class="container-lg px-3 my-5 markdown-body">
      <!-- custom default layout structure -->
      <article>
        <header style="margin-bottom: 2rem; border-bottom: 1px solid #e1e4e8; padding-bottom: 1rem;">
          {% include linktree.html %}
        </header>
        <h1>{{ page.title }}</h1>
        
        {% if page.date or page.tags %}
          <p>
            <blockquote>
              {% if page.date %}
                <em><time datetime="{{ page.date | date_to_xmlschema }}">
                  Published on {{ page.date | date: "%B %d, %Y" }}
                </time></em>
              {% endif %}
              {% if page.tags %}
                <br><em>Tags: {{ page.tags | join: ", " }}</em>
              {% endif %}
            </blockquote>
          </p>
        {% endif %}

        <div class="content">
          {{ content }}
        </div>
      </article>
      <!-- end of custom structure -->
    </div>
  </body>
</html>
